# ساخت IPA بدون امضا برای سایدلود با Apple ID رایگان (Sideloadly/AltStore).
# این ورک‌فلو فقط با اجرای دستی (workflow_dispatch) شروع می‌شود.
# خروجی، IPA امضانشده است که روی آیفون نصب نمی‌شود مگر اینکه خودت آن را
# با Apple ID رایگانت امضا کنی؛ جزئیات در CLOUD-BUILD.md مسیر ۲ آمده است.
# باندل آیدی پروژه: ir.atroweb.vasleh.personal
name: iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || xcode-select -p
      - name: Build for device (no signing)
        run: |
          xcodebuild build \
            -project VaslehPersonal.xcodeproj \
            -scheme VaslehPersonal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'VaslehPersonal.app' -path '*Release-iphoneos*' | head -n 1)
          if [ -z "$APP" ]; then echo "VaslehPersonal.app not found"; find ~/Library/Developer/Xcode/DerivedData -name 'VaslehPersonal.app' | head; exit 1; fi
          echo "Found app: $APP"
          rm -rf Payload VaslehPersonal-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r VaslehPersonal-unsigned.ipa Payload
          ls -la VaslehPersonal-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VaslehPersonal-unsigned-ipa
          path: VaslehPersonal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
